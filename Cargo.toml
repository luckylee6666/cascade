[workspace]
resolver = "2"
members = [
    "crates/cc-core",
    "crates/cc-store",
    "crates/cc-server",
    "crates/cc-cli",
    "crates/cc-desktop",
    "sdk/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
