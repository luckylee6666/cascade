name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (arm64)
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest     # x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ── CLI + server binaries ──────────────────────────────
      - name: Build CLI
        run: cargo build --release -p cc-cli -p cc-server

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/release
          tar czf "${GITHUB_WORKSPACE}/cascade-cli-${{ matrix.target }}.tar.gz" cascade cascade-server

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/cascade.exe,target/release/cascade-server.exe `
            -DestinationPath cascade-cli-${{ matrix.target }}.zip

      # ── Stage sidecars so the desktop bundle is self-contained ──
      - name: Stage sidecars
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p crates/cc-desktop/binaries
          cp "target/release/cascade${ext}" "crates/cc-desktop/binaries/cascade-cli-${{ matrix.target }}${ext}"
          cp "target/release/cascade-server${ext}" "crates/cc-desktop/binaries/cascade-server-${{ matrix.target }}${ext}"
          ls -la crates/cc-desktop/binaries/

      # ── Desktop app (Tauri) ────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build desktop bundles
        working-directory: crates/cc-desktop
        run: tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: cascade-${{ matrix.target }}
          if-no-files-found: error
          path: |
            cascade-cli-${{ matrix.target }}.*
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**
          body: |
            ## 安装

            - **macOS (Apple Silicon)**：下载 `Cascade_*_aarch64.dmg`（桌面端）或 `cascade-cli-aarch64-apple-darwin.tar.gz`（命令行）
            - **Windows (x64)**：下载 `Cascade_*_x64-setup.exe`（桌面端）或 `cascade-cli-x86_64-pc-windows-msvc.zip`（命令行）

            > 桌面端安装包已内置 CLI 与本地服务（局域网分享 / AI 接入开箱即用），无需单独安装。
            > 未签名构建：macOS 首次打开需右键 → 打开；Windows SmartScreen 选择"仍要运行"。
            > 需要终端里直接用 `cascade` 命令时，再装 CLI 包并加入 PATH。
