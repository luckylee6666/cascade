name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (arm64)
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest     # x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ── CLI + server binaries (staged as desktop sidecars) ──
      - name: Build CLI
        run: cargo build --release -p cc-cli -p cc-server

      - name: Stage sidecars
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p crates/cc-desktop/binaries
          cp "target/release/cascade${ext}" "crates/cc-desktop/binaries/cascade-cli-${{ matrix.target }}${ext}"
          cp "target/release/cascade-server${ext}" "crates/cc-desktop/binaries/cascade-server-${{ matrix.target }}${ext}"
          ls -la crates/cc-desktop/binaries/

      # ── Desktop app (Tauri) ────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build desktop bundles
        working-directory: crates/cc-desktop
        shell: bash
        run: tauri build --bundles ${{ matrix.bundles }} --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"

      - uses: actions/upload-artifact@v4
        with:
          name: cascade-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**
          body: |
            ## 安装

            - **macOS (Apple Silicon)**：`Cascade_*_aarch64.dmg`
            - **Windows (x64)**：`Cascade_*_x64-setup.exe`

            一个安装包全套：桌面端 + `cascade` 命令行 + 本地服务（局域网分享 / AI 接入开箱即用）。

            > 终端里直接用 `cascade`：macOS 在 `Cascade.app/Contents/MacOS/cascade-cli`，Windows 在安装目录 `cascade-cli.exe`；要全局命令自行加 PATH 或软链即可。
            > 未签名构建：macOS 首次打开需右键 → 打开；Windows SmartScreen 选择"仍要运行"。
