[package]
name = "cascade-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust SDK for Cascade — remote config consumption (HTTP + SSE, snapshot fallback)"
repository = "https://github.com/luckylee6666/cascade"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
anyhow = "1"
url = "2"
dirs = "5"
