[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascade-sdk"
version = "0.1.0"
description = "Cascade Python SDK"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["cascade"]
